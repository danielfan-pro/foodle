databases:
  - name: postgres
    ipAllowList: []
    plan: free

services:
  - type: web
    name: foodle
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
